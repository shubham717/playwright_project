name: Playwright Tests

on:
  #1 Manual Trigger with Future-Proof Marker Input
  workflow-dispatch:
    inputs:
      marker:
        description: 'Pytest marker to run (e.g., "regression", "smoke"). Leave blank for all'
        required: false
        type: string
        default: ''

  #2 Daily scheduled runs (In UTC)
  schedule:
    - cron: '30 03 * * *' #Runs at 9:00 AM IST
    - cron: '30 12 * * *' #Runs at 6:p00 PM IST

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure Browsers are Installed
      run: playwright install --with-deps  
    
    - name: Run Pytest
      run: |
        # if manually triggered with marker, run specific tests.
        # Otherwise, run the entire test suite.
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.marker }}" != ""]]; then
          echo "Running tests with marker: ${{ inputs.marker }}"
          pytest -m "${{ inputs.marker }}"
        else
          echo "Running All tests"
          pytest
        fi  

    - name: Upload Test 
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }} # uploads artifacts even if tests fail
      with:
        name: playwright-test-result
        path: test-results/
        retentioon-days: 14

    

